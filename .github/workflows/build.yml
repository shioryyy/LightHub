name: Build and Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Test (no hardware)
        run: dotnet test --no-restore -c Release --logger trx --results-directory artifacts/test-results
      - name: Report test failures
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/test-results -Filter *.trx -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$results = Get-Content $_.FullName -Raw
            $counts = $results.TestRun.ResultSummary.Counters
            "Tests: $($counts.total) total, $($counts.passed) passed, $($counts.failed) failed, $($counts.notExecuted) not executed" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            foreach ($test in $results.TestRun.Results.UnitTestResult) {
              if ($test.outcome -eq 'Failed') {
                $message = "$($test.testName): $($test.Output.ErrorInfo.Message) $($test.Output.ErrorInfo.StackTrace)"
                $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error::$message"
              }
            }
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.rid }}
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
      - name: Publish self-contained package
        shell: pwsh
        run: ./tools/publish.ps1 -Runtime ${{ matrix.rid }} -SkipTests
      - name: Verify package and provenance
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          ./tools/verify-package.ps1 -Directory "dist/LightHub-$version-${{ matrix.rid }}" -Runtime '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v4
        with:
          name: LightHub-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            artifacts/test-results/*.trx
          if-no-files-found: error
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build source archive and reconstruct without Git metadata
        shell: pwsh
        run: |
          ./tools/source-archive.ps1
          [xml]$props = Get-Content Directory.Build.props -Raw
          $zip = "dist/LightHub-$($props.Project.PropertyGroup.Version)-source.zip"
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            if (@($archive.Entries | Where-Object { $_.FullName -match '\\|(^|/)(bin|obj|artifacts)/|\.(lhbackup|lhmacro|lhdraft|lhpreset|log)$' }).Count) { throw 'Unexpected source archive content' }
          } finally { $archive.Dispose() }
          Expand-Archive -LiteralPath $zip -DestinationPath artifacts/source-rebuild
          Push-Location artifacts/source-rebuild/LightHub
          try {
            dotnet restore --locked-mode
            if ($LASTEXITCODE -ne 0) { throw 'Source restore failed' }
            dotnet test --no-restore -c Release --logger trx --results-directory ../../source-test-results
            if ($LASTEXITCODE -ne 0) { throw 'Source tests failed' }
          } finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LightHub-source-and-test-results
          path: |
            dist/*-source.zip
            artifacts/source-test-results/*.trx
          if-no-files-found: error
