name: Build and Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        # The lock files contain the complete RID graph. Passing a single
        # runtime here makes NuGet treat the lock as changed on Unix runners.
        run: dotnet restore --locked-mode
      - name: Test (no hardware)
        run: dotnet test --no-restore -c Release --logger trx --results-directory artifacts/test-results
      - name: Publish self-contained package
        shell: pwsh
        run: ./tools/publish.ps1 -Runtime ${{ matrix.rid }} -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: LightHub-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            artifacts/test-results/*.trx
          if-no-files-found: error
