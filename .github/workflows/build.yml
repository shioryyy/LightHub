name: Build and Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Test (no hardware)
        run: dotnet test --no-restore -c Release --logger trx --results-directory artifacts/test-results
      - name: Report test failures
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/test-results -Filter *.trx -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$results = Get-Content $_.FullName -Raw
            foreach ($test in $results.TestRun.Results.UnitTestResult) {
              if ($test.outcome -eq 'Failed') {
                $message = "$($test.testName): $($test.Output.ErrorInfo.Message) $($test.Output.ErrorInfo.StackTrace)"
                $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error::$message"
              }
            }
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.rid }}
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
      - name: Publish self-contained package
        shell: pwsh
        run: ./tools/publish.ps1 -Runtime ${{ matrix.rid }} -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: LightHub-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            artifacts/test-results/*.trx
          if-no-files-found: error
